name: Build and deploy Zola site to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # install Zola using the official setup action (uses prebuilt binary)
      - name: Setup Zola
        uses: getzola/setup-zola@v1
        with:
          zola-version: '0.19.2'

      - name: Build site
        run: zola build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
